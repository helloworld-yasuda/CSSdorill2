<!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>CSSドリル2</title>
    </head>
    <body>
        <!--No.1 子要素を横並びにする-->
        <div class="container" id="first">
            <p>要素1</p>
            <p>要素2</p>
        </div>
        <!--No.2 子要素を両端よせにする-->
        <div class="container" id="between">
            <p>要素1</p>
            <p>要素2</p>
        </div>
        <!--No.3 子要素を水平方向に中央よせにする-->
        <div class="container" id="center">
            <p>要素1</p>
            <p>要素2</p>
        </div>
            <!--No.4 子要素を水平方向に左寄せする-->
        <div class="container" id="left">
            <p>要素1</p>
            <p>要素2</p>
        </div>
            <!--No.5 子要素を水平方向に右寄せする-->
        <div class="container" id="right">
            <p>要素1</p>
            <p>要素2</p>
        </div>
            <!--No.6 子要素を垂直方向に上寄せする-->
        <div class="container" id="top">
            <p>要素1</p>
            <p>要素2</p>
        </div>
            <!--No.7 子要素を垂直方向に下寄せする-->
        <div class="container" id="bottom">
            <p>要素1</p>
            <p>要素2</p>
        </div>
            <!--No.8 子要素を垂直方向に中央寄せする-->
        <div class="container" id="vertical-center">
            <p>要素1</p>
            <p>要素2</p>
        </div>
        <div class="container-layout">
            <div class="container-first">
                <div class="item-first"></div>
                <div class="item-second"></div>
            </div>
            <div class="container-second">
                <div class="item-third">
                    <div class="item-fifth"></div>
                    <div class="item-sixth"></div>
                </div>
                <div class="item-fourth">
                    <div class="item-seventh"></div>
                    <div class="item-eighth"></div>
                    <div class="item-eighth"></div>
                    <div class="item-eighth"></div>
                </div>
            </div>
        </div>
        <div class="grid-border">
            <div class="grid-layout">
                <div class="grid itemA">
                    <div class="grid leftbox"></div>
                    <div class="grid rightbox"></div>
                    <div class="grid secondbox"></div>
                    <div class="grid thirdbox"></div>
                </div>
                <div class="grid itemB"></div>
                <div class="grid itemC"></div>
                <div class="grid itemD"></div>
                <div class="grid itemE"></div>
                <div class="grid itemF"></div>
                <div class="grid itemG"></div>
            </div>
        </div>
    </body>
</html>
